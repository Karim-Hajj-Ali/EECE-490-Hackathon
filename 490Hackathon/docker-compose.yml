
version: "3.9"
services:
  train:
    build: .
    image: bankruptcy-predictor:latest
    command: ["train","--csv","/data/american_bankruptcy.csv","--outdir","/models"]
    volumes:
      - ./data:/data:ro
      - ./models:/models
  app:
    build: .
    image: bankruptcy-predictor:latest
    command: ["serve","--model","/models/catboost_bankruptcy.cbm","--meta","/models/metadata.json"]
    ports: ["7860:7860"]
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    volumes:
      - ./models:/models
    depends_on:
      - train
